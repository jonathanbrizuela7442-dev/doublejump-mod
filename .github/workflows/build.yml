name: Build Mod
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle executable
        run: chmod +x doublejump-mod/gradlew
      - name: build jar
        run: |
          cd doublejump-mod
          ./gradlew build
      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: "doublejump-mod/build/libs/*.jar"
