name: Build Mod
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: doublejump-mod

      - name: Build with Gradle
        run: gradle build
        working-directory: doublejump-mod

      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: "doublejump-mod/build/libs/*.jar"
